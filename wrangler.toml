# Cloudflare tự build & deploy Worker từ repo GitHub này (Workers Builds).
# D1 đã tạo ở lần deploy đầu (ghi ID cố định bên dưới). R2 xem ghi chú bên dưới.
name = "nha-chat-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
APP_URL = "https://nha.tytlinhxuan.cloud"

[[d1_databases]]
binding = "DB"
database_name = "nha-chat-api-db"
database_id = "deae60ab-da0c-4e6d-9ab9-c63df4fbd4be"

# R2 (ảnh/tệp/ghi âm): tạm tắt vì tài khoản chưa bật được R2.
# Khi bật R2 và tạo bucket "nha-chat-files", bỏ dấu # ở 3 dòng dưới rồi commit:
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "nha-chat-files"

# Thời gian thực (WebSocket) — Durable Object bản SQLite, miễn phí
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[observability]
enabled = true
